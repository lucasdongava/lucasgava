<style>
  :root {
    --bg: #fbfbfa;
    --fg: #111110;
    --muted: #6f6f6c;
    --line: #d4d4d0;
    --soft: #f3f3f1;
    --soft-hover: #ecece9;
  }
  html.dark {
    --bg: #111110;
    --fg: #ededeb;
    --muted: #8d8d89;
    --line: #3a3a38;
    --soft: #1b1b1a;
    --soft-hover: #242423;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  html, body { background: var(--bg); color: var(--fg); height: 100%; overflow: hidden; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    height: 100vh;
    height: 100dvh;
    transition: background .3s, color .3s;
  }
  .corner {
    position: fixed; top: 22px;
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--muted); line-height: 0;
    transition: color .2s, border-color .2s;
  }
  .corner::after { content: ""; position: absolute; inset: -12px; }
  .corner:hover { color: var(--fg); }
  .theme {
    right: 56px; width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid currentColor;
  }
  .lang { right: 26px; }
  .lang svg { display: block; width: 14px; height: 12px;
    fill: none; stroke: currentColor; stroke-width: 1; stroke-linejoin: round;
    transition: transform .3s cubic-bezier(.4, 0, .2, 1); }
  .lang[aria-expanded="true"] svg { transform: rotate(180deg); }
  /* Fechado continua no fluxo, só invisível e sem clique, para poder animar */
  .menu {
    position: fixed; top: 44px; right: 26px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(-5px);
    transition: opacity .22s ease, transform .28s cubic-bezier(.4, 0, .2, 1),
                visibility 0s linear .28s;
  }
  .menu.open {
    opacity: 1; visibility: visible; pointer-events: auto; transform: none;
    transition: opacity .22s ease, transform .28s cubic-bezier(.4, 0, .2, 1),
                visibility 0s;
  }
  .menu button {
    font: inherit; font-size: 12px; background: none; border: 0; padding: 2px 0;
    color: var(--muted); cursor: pointer;
    opacity: 0; transform: translateY(-4px);
    transition: color .2s, opacity .2s ease, transform .26s cubic-bezier(.4, 0, .2, 1);
  }
  .menu.open button { opacity: 1; transform: none; }
  /* entram em cascata ao abrir; ao fechar saem juntos */
  .menu.open button:nth-child(1) { transition-delay: 0ms, 30ms, 30ms; }
  .menu.open button:nth-child(2) { transition-delay: 0ms, 60ms, 60ms; }
  .menu.open button:nth-child(3) { transition-delay: 0ms, 90ms, 90ms; }
  .menu.open button:nth-child(4) { transition-delay: 0ms, 120ms, 120ms; }
  .menu.open button:nth-child(5) { transition-delay: 0ms, 150ms, 150ms; }
  .menu.open button:nth-child(6) { transition-delay: 0ms, 180ms, 180ms; }
  .menu button:hover, .menu button.on { color: var(--fg); }
  .corner:focus-visible, .menu button:focus-visible,
  .block:focus-visible, .lab:focus-visible {
    outline: 2px solid var(--muted); outline-offset: 3px;
  }
  main {
    max-width: 640px;
    height: 100%;
    margin: 0 auto;
    padding: clamp(32px, 7vh, 64px) 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .muted { color: var(--muted); }
  .note { text-wrap: pretty; }

  .palette {
    position: relative;
    flex: 0 1 280px;
    min-height: 100px;
    margin: clamp(28px, 6vh, 56px) 0 0;
  }
  /* A faixa recorta os cantos arredondados; os hex ficam fora dela */
  .strip {
    display: flex;
    height: 100%;
    border-radius: 14px;
    overflow: hidden;
  }
  .block, .lab {
    flex: 1 1 0;
    min-width: 0;
    transition: flex-grow .8s cubic-bezier(.4, 0, .2, 1),
                background-color .8s ease,
                opacity .25s ease,
                color .2s;
  }
  .block { cursor: pointer; }
  .block, .lab { user-select: none; -webkit-user-select: none; }
  .block.off, .lab.off { flex-grow: 0; pointer-events: none; }
  .lab.off { opacity: 0; }
  .labels {
    position: absolute; left: 0; right: 0; top: calc(100% + 12px);
    display: flex;
  }
  .lab {
    text-align: center;
    font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    cursor: pointer;
  }
  .lab.hot { color: var(--fg); }
  .no-anim .block, .no-anim .lab, .no-anim .layer { transition: none; }

  .source {
    margin-top: 60px;
    color: var(--muted);
    min-height: 5.1em;
    display: grid;
  }
  .source .layer { grid-area: 1 / 1; opacity: 0; pointer-events: none;
                   transition: opacity .8s ease; }
  .source .layer.on { pointer-events: auto; }
  .source .layer.on { opacity: 1; }
  .source em { font-style: italic; color: var(--fg); }
  .source a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
  .source a:hover { border-color: var(--muted); }

  .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  button.btn {
    font: inherit; color: var(--fg); background: var(--soft);
    border: 1px solid transparent; border-radius: 6px;
    padding: 9px 18px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  button.btn:hover { background: var(--soft-hover); border-color: var(--line); }
  button.btn:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  button.ghost {
    background: none; color: var(--muted); border-color: var(--line);
    transition: color .2s, border-color .2s, opacity .2s;
  }
  button.ghost:hover:not(:disabled) { background: none; color: var(--fg); border-color: var(--muted); }
  button.ghost:disabled { opacity: .4; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    .block, .lab, .layer, body, .menu, .menu button, .lang svg
      { transition-duration: .01s !important; transition-delay: 0s !important; }
  }
  /* Rede de segurança: em telas muito baixas, deixa rolar em vez de cortar */
  @media (max-height: 380px) {
    html, body { height: auto; overflow: auto; }
    main { height: auto; min-height: 100vh; }
  }
  @media (max-width: 520px) {
    .palette { flex-basis: 200px; }
    .lab { font-size: 10px; }
    .actions { margin-top: 16px; }
  }
</style>
</head>

 of Art","1a171635507e5a7a4eb0392ce0b23c8a8782","https://www.nga.gov/collection/art-object-page.67553.html"],["Abstract Composition in Purple, Blue, Pink, Black, and Gra","Mark Rothko","c. 1944","National Gallery of Art","6b3a6e35507ed4868c1a17168a8782","https://www.nga.gov/collection/art-object-page.67600.html"],["Abstract Composition in Blue, Black, Gray, and Tan","Mark Rothko","c. 1944/1946","National Gallery of Art","35507e1a17168a8782c2a075","https://www.nga.gov/collection/art-object-page.67601.html"],["Untitled (Brown and gray)","Mark Rothko","1969","National Gallery of Art","6b4a338a8782","https://www.nga.gov/collection/art-object-page.67654.html"],["Color Test in Crimson, Black, and Umber","Mark Rothko","","National Gallery of Art","9b23351a17164a3528","https://www.nga.gov/collection/art-object-page.68582.html"],["Abstract Composition in Blue, Black, Gray, and Red","Mark Rothko","","National Gallery of Art","35507e1a17168a8782b0392c","https://www.nga.gov/collection/art-object-page.69045.html"],["Abstract Composition in Black, Gray, and Blue","Mark Rothko","","National Gallery of Art","1a17168a878235507e","https://www.nga.gov/collection/art-object-page.69073.html"],["Abstract Composition in Yellow, Green, Blue, Black, and Br","Mark Rothko","","National Gallery of Art","e0b23c5a7a4e35507e1a17166b4a33","https://www.nga.gov/collection/art-object-page.69077.html"],["Abstract Composition in Black, Orange, Green, Blue, Gray, ","Mark Rothko","","National Gallery of Art","1a1716d1702a5a7a4e35507e8a8782efe9dd","https://www.nga.gov/collection/art-object-page.69082.html"],["Abstract Composition in Red, Brown, Black, Blue, and White","Mark Rothko","","National Gallery of Art","b0392c6b4a331a171635507eefe9dd","https://www.nga.gov/collection/art-object-page.69085.html"],["Corner Mirror, brown-blue (737-1, 737-2)","Gerhard Richter","1991","Tate","6b4a3335507e","https://www.tate.org.uk/art/artworks/richter-corner-mirror-brown-blue-737-1-737-2-ar00023"],["Corner Mirror, green-red (737-2 A, 737-2 B)","Gerhard Richter","1991","Tate","5a7a4eb0392c","https://www.tate.org.uk/art/artworks/richter-corner-mirror-green-red-737-2-a-737-2-b-ar00024"],["Mirror Painting (Grey, 735-2)","Gerhard Richter","1991","Tate","3e3f408a8b8cc4c5c6","https://www.tate.org.uk/art/artworks/richter-mirror-painting-grey-735-2-ar00022"],["Abstract Painting (Grey) (880-3)","Gerhard Richter","2002","Tate","3e3f408a8b8cc4c5c6","https://www.tate.org.uk/art/artworks/richter-abstract-painting-grey-880-3-ar00030"],["Light Red Over Black","Mark Rothko","1957","Tate","b8584a1a1716","https://www.tate.org.uk/art/artworks/rothko-light-red-over-black-t00275"]];

const hexes = s => s.match(/.{6}/g).map(h => "#" + h);
const linkOf = w => w[3] === 0
  ? "https://www.artic.edu/artworks/" + w[4]
  : "https://clevelandart.org/art/" + w[4];

// Junta tudo num só sorteio: [tipo, índice, cores]
const POOL = [];
REAL.forEach((w, i) => POOL.push([0, i, hexes(w[5])]));
APPROX.forEach((w, i) => POOL.push([1, i, hexes(w[4])]));

// Regra do projeto: no mínimo 2 e no máximo 6 cores por paleta
const VALID = POOL.filter(e => e[2].length >= 2 && e[2].length <= 6);

const $palette = document.getElementById("palette");
const $source = document.getElementById("source");
const $prev = document.getElementById("prev");

// Histórico para voltar quando a pessoa clica rápido demais
let history = [];
let pos = -1;
let bag = [];

// Sorteio sem repetição até passar por todas as paletas
function nextIndex() {
  if (!bag.length) {
    const last = history[pos];
    bag = VALID.map((_, i) => i).filter(i => i !== last);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  return bag.pop();
}

const MAX = 6;

// Os 6 blocos existem desde o início. Trocar de paleta só muda cor e largura
// de cada um, então a transição é contínua, sem tela vazia no meio.
const $strip = document.createElement("div");
$strip.className = "strip";
const $labels = document.createElement("div");
$labels.className = "labels";
$palette.append($strip, $labels);

const swatches = Array.from({ length: MAX }, () => {
  const block = document.createElement("div");
  block.className = "block off";
  block.tabIndex = 0;
  block.setAttribute("role", "button");
  const label = document.createElement("div");
  label.className = "lab off";
  const hover = on => label.classList.toggle("hot", on);
  block.addEventListener("mouseenter", () => hover(true));
  block.addEventListener("mouseleave", () => hover(false));
  const onClick = () => copy(block, label);
  block.addEventListener("click", onClick);
  block.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); }
  });
  label.addEventListener("click", onClick);
  $strip.appendChild(block);
  $labels.appendChild(label);
  return { block, label };
});

const esc = s => String(s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// A camada que sai do fundido cruzado fica com pointer-events: none, senão
// o link dela continuaria clicável por baixo e abriria a obra anterior.
const titleLink = (title, url) => url
  ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"><em>' + esc(title) + "</em></a>"
  : "<em>" + esc(title) + "</em>";

// O aviso diz de onde a paleta veio, e é honesto sobre as que não são extraídas
function caption(entry) {
  const [kind, i] = entry;
  const L = I18N[lang];
  const w = kind === 0 ? REAL[i] : APPROX[i];
  const url = kind === 0 ? linkOf(w) : w[5];
  const place = kind === 0 ? MUSEUMS[w[3]] : esc(w[3]);
  const s = L.cap(titleLink(w[0], url), esc(w[1]), esc(w[2]), place);
  return kind === 1 ? s + " " + L.approx : s;
}

function render(entry) {
  const colors = entry[2];
  const n = colors.length;
  swatches.forEach(({ block, label }, i) => {
    const on = i < n;
    block.classList.toggle("off", !on);
    block.tabIndex = on ? 0 : -1;
    label.classList.toggle("off", !on);
    if (on) {
      const hex = colors[i];
      block.style.backgroundColor = hex;
      block.dataset.hex = hex;
      block.title = I18N[lang].copy + " " + hex;
      block.setAttribute("aria-label", I18N[lang].copy + " " + hex);
      label.textContent = hex;
    }
  });

  // Troca o texto com um fundido cruzado entre duas camadas
  const layers = $source.querySelectorAll(".layer");
  const showing = $source.querySelector(".layer.on");
  const next = showing === layers[0] ? layers[1] : layers[0];
  next.innerHTML = caption(entry);
  next.classList.add("on");
  showing.classList.remove("on");
}

function show(i) {
  render(VALID[i]);
  $prev.disabled = pos <= 0;
}

function generate() {
  const i = nextIndex();
  history = history.slice(0, pos + 1);
  history.push(i);
  if (history.length > 200) history.shift();
  pos = history.length - 1;
  show(i);
}

function back() {
  if (pos <= 0) return;
  pos--;
  show(history[pos]);
}

async function copy(el, label) {
  const hex = el.dataset.hex;
  let ok = false;
  try { await navigator.clipboard.writeText(hex); ok = true; } catch (e) {}
  if (!ok) {
    // Plano B para ambientes que bloqueiam a API de área de transferência
    const t = document.createElement("textarea");
    t.value = hex; t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select();
    try { ok = document.execCommand("copy"); } catch (e) {}
    t.remove();
  }
  if (!ok) return;
  label.textContent = I18N[lang].copied;
  clearTimeout(label._t);
  label._t = setTimeout(() => (label.textContent = el.dataset.hex), 1000);
}

document.getElementById("next").addEventListener("click", generate);
$prev.addEventListener("click", back);
document.addEventListener("keydown", e => {
  if (e.repeat || e.target !== document.body) return;
  if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); generate(); }
  if (e.code === "ArrowLeft") { e.preventDefault(); back(); }
});

const $theme = document.getElementById("theme");
const $lang = document.getElementById("lang");
const $menu = document.getElementById("menu");

function applyLang(code) {
  lang = I18N[code] ? code : "en";
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  document.getElementById("heading").textContent = L.title;
  document.getElementById("note").textContent = L.note;
  document.getElementById("next").textContent = L.next;
  $prev.textContent = L.prev;
  $theme.setAttribute("aria-label", L.theme);
  $lang.setAttribute("aria-label", L.lang);
  $menu.querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.code === lang));
  try { localStorage.setItem("palettes:lang", lang); } catch (e) {}
  if (pos >= 0) show(history[pos]);   // redesenha o aviso no novo idioma
}

LANGS.forEach(code => {
  const b = document.createElement("button");
  b.textContent = I18N[code].name;
  b.dataset.code = code;
  b.addEventListener("click", () => { applyLang(code); closeMenu(); });
  $menu.appendChild(b);
});

const closeMenu = () => { $menu.classList.remove("open"); $lang.setAttribute("aria-expanded", "false"); };
$lang.setAttribute("aria-expanded", "false");
$lang.addEventListener("click", e => {
  e.stopPropagation();
  const open = $menu.classList.toggle("open");
  $lang.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", e => {
  if (!$menu.contains(e.target) && e.target !== $lang) closeMenu();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });

let saved = null;
try { saved = localStorage.getItem("palettes:theme"); } catch (e) {}
if (saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.classList.add("dark");
}
$theme.addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  try { localStorage.setItem("palettes:theme", dark ? "dark" : "light"); } catch (e) {}
});

let savedLang = null;
try { savedLang = localStorage.getItem("palettes:lang"); } catch (e) {}
applyLang(savedLang || "en");

// A primeira paleta aparece direto, sem animar a entrada
$palette.classList.add("no-anim");
$source.classList.add("no-anim");
generate();
requestAnimationFrame(() => requestAnimationFrame(() => {
  $palette.classList.remove("no-anim");
  $source.classList.remove("no-anim");
}));
</script>
