<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Lucas Gava</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="icon.png" type="image/x-icon">
</head>

<body>
  <div class="container-conteudo">
    <h1><a href="index.html" class="home-link" data-i18n="about_title">about</a></h1>

    <p data-i18n="about_p1">
      born in 2003, Lucas Gava is a brazilian front-end developer<br>
      dedicated to creating efficient digital products and solutions.
    </p>

    <p data-i18n="about_p2">
      he has experience developing high-conversion, high-retention,<br>
      and scalable projects in collaboration with creative teams.
    </p>

    <nav class="links">
      <a href="index.html" data-i18n="nav_home">home</a>
      <a href="about.html" data-i18n="nav_about">about</a>
      <a href="works.html" data-i18n="nav_works">works</a>
      <a href="contact.html" data-i18n="nav_contact">contact</a>
      <div class="lang-select-wrapper">
        <select class="lang-select" id="lang-switcher">
          <option value="pt">português</option>
          <option value="en">english</option>
          <option value="es">español</option>
          <option value="zh">中文</option>
        </select>
      </div>
    </nav>
  </div>

  <script>
    const translations = {
      pt: {
        about_title: "sobre",
        about_p1: "nascido em 2003, Lucas Gava é um desenvolvedor front-end brasileiro<br>dedicado a criar produtos e soluções digitais eficientes.",
        about_p2: "possui experiência no desenvolvimento de projetos escaláveis,<br>de alta conversão e alta retenção em colaboração com equipes criativas.",
        nav_home: "home",
        nav_about: "sobre",
        nav_works: "trabalhos",
        nav_contact: "contato"
      },
      en: {
        about_title: "about",
        about_p1: "born in 2003, Lucas Gava is a brazilian front-end developer<br>dedicated to creating efficient digital products and solutions.",
        about_p2: "has experience developing high-conversion, high-retention,<br>and scalable projects in collaboration with creative teams.",
        nav_home: "home",
        nav_about: "about",
        nav_works: "works",
        nav_contact: "contact"
      },
      es: {
        about_title: "sobre mí",
        about_p1: "nacido en 2003, Lucas Gava es un desarrollador front-end brasileño<br>dedicado a crear productos y soluciones digitales eficientes.",
        about_p2: "tiene experiencia desarrollando proyectos escalables,<br>de alta conversión y alta retención junto a equipos creativos.",
        nav_home: "inicio",
        nav_about: "sobre mí",
        nav_works: "trabajos",
        nav_contact: "contacto"
      },
      zh: {
        about_title: "关于",
        about_p1: "出生于2003年，Lucas Gava 是一名巴西前端开发者，<br>致力于创造高效的数字产品和解决方案。",
        about_p2: "他拥有开发高转化率、高留存率、可扩展项目的经验，<br>并与创意团队合作完成这些项目。",
        nav_home: "主页",
        nav_about: "关于",
        nav_works: "作品",
        nav_contact: "联系"
      }
    };

    const langSwitcher = document.getElementById("lang-switcher");
    const elements = document.querySelectorAll("[data-i18n]");

    const savedLang = localStorage.getItem("lang") || "pt";
    langSwitcher.value = savedLang;
    applyLanguage(savedLang);

    langSwitcher.addEventListener("change", () => {
      const lang = langSwitcher.value;
      localStorage.setItem("lang", lang);
      applyLanguage(lang);
    });

    function applyLanguage(lang) {
      elements.forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.innerHTML = translations[lang][key];
      });
    }
  </script>
  <script src="lang-select.js"></script>
</body>

</html>
